<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin • Kandungan Gizi MBG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="container py-3 d-flex align-items-center justify-content-between">
    <div>
      <div class="brand-kicker">BADAN GIZI NASIONAL</div>
      <h1 class="brand-title">Admin Kandungan Gizi</h1>
    </div>
    <div class="d-flex gap-2">
      <a class="admin-link" href="../">Lihat Publik</a>
      <button id="logoutBtn" class="btn btn-light btn-sm d-none">Keluar</button>
    </div>
  </div>
</header>

<main class="container py-4">
  <section id="loginPanel" class="auth-card">
    <div class="eyebrow">AKSES ADMIN</div>
    <h2>Masuk ke dashboard</h2>
    <p class="text-muted">Gunakan akun admin Supabase yang sudah dibuat.</p>
    <form id="loginForm">
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-control mb-3" required>
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control mb-3" required>
      <button class="btn btn-primary w-100">Masuk</button>
      <div id="loginMsg" class="small mt-3"></div>
    </form>
  </section>

  <section id="dashboard" class="d-none">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <div class="eyebrow">DASHBOARD</div>
        <h2 class="page-heading">Kelola menu harian</h2>
      </div>
      <button id="newBtn" class="btn btn-primary">+ Menu Baru</button>
    </div>

    <div id="formMsg" class="alert d-none"></div>

    <form id="menuForm" class="admin-card">
      <input id="menuId" type="hidden">
      <div class="section-title mt-0">Data menu</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tanggal</label>
          <input id="tanggal" type="date" class="form-control" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Nama menu</label>
          <input id="nama_menu" class="form-control" placeholder="Contoh: Nasi Ayam Teriyaki" required>
        </div>
        <div class="col-12">
          <label class="form-label">Deskripsi</label>
          <textarea id="deskripsi" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-md-4"><label class="form-label">Item 1</label><input id="item1" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Item 2</label><input id="item2" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Item 3</label><input id="item3" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Item 4</label><input id="item4" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Item 5</label><input id="item5" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Alergen</label><input id="alergen" class="form-control" placeholder="Contoh: susu, telur"></div>
      </div>

      <div class="section-title">Kandungan gizi per porsi</div>
      <div id="nutritionForms"></div>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Simpan Menu</button>
        <button class="btn btn-outline-secondary" id="cancelBtn" type="button">Reset</button>
      </div>
    </form>

    <div class="admin-card mt-4">
      <div class="section-title mt-0">Riwayat menu</div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Tanggal</th><th>Menu</th><th>Aksi</th></tr></thead>
          <tbody id="menuTable"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
